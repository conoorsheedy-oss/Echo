# Builds the Windows installer and attaches it to a GitHub Release.
#
# How to release:
#   1. Set "version" in package.json (e.g. 0.1.0) and commit it.
#   2. git tag v0.1.0 && git push origin v0.1.0
# This workflow then builds dist/Echo-Setup-0.1.0.exe on Windows and creates
# (or updates) the "v0.1.0" release with the .exe attached.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # needed to create the release and upload the .exe

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check the tag matches package.json
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}." >&2
            exit 1
          fi

      # Also runs the postinstall script, which downloads the hand-gesture model.
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # `predist` re-checks the hand-gesture files and fails if any are missing,
      # so a release never ships without them. publish is null in package.json,
      # so electron-builder only builds; the next step does the upload.
      - name: Build installer (dist/Echo-Setup-<version>.exe)
        run: npm run dist

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Echo-Setup-*.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
